name: Compile aes_nonce-go
on:
  push:
    branches:
      - main
jobs:
  aes_nonce-go-linux:
    strategy:
      matrix:
        arch:
          - runner: ubuntu-22.04
            name: x86_64
          - runner: ubuntu-22.04-arm
            name: aarch64

    name: linux-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Run compile script
        run: |
          go build -o aes_cryptex_nonce aes_cryptex_nonce.go
          go build -o aes_nonce aes_nonce.go

      - name: Zip aes_nonce-go
        run: zip -r aes_nonce-go_linux-${{ matrix.arch.name }}.zip aes_cryptex_nonce aes_nonce

      - name: Update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest \
            aes_nonce-go_linux-${{ matrix.arch.name }}.zip \
            --clobber -R ${{ github.repository }}

          gh release edit latest \
            --title "Latest" \
            --target ${{ github.sha }} -R ${{ github.repository }}
